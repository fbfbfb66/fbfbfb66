<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - Goings商城</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/cart/cartManager.js"></script>
    <script src="assets/js/cart/cartCount.js"></script>
</head>
<body class="cart-page-body">
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="logo">
            <h1><span class="logo-brand">Goings</span><span class="logo-text">商城</span></h1>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">首页</a>
            <a href="hot.html" class="nav-link">热销</a>
            <a href="new.html" class="nav-link">新品</a>
            <a href="sale.html" class="nav-link">优惠</a>
        </nav>
        <div class="cart">
            <a href="cart.html" class="cart-link">
                <span class="cart-icon">🛒</span>
                <span class="cart-count">0</span>
            </a>
        </div>
        <div class="user-welcome" id="user-welcome">
            <a href="login.html" class="login-link" id="login-link">登录</a>
            <div class="user-avatar-container" id="user-avatar-container" style="display: none;">
                <a href="user.html" class="user-avatar-link">
                    <img src="assets/images/avatar-placeholder.png" alt="用户头像" id="nav-user-avatar" class="user-avatar">
                    <span class="user-name" id="nav-username">用户</span>
                </a>
            </div>
        </div>
    </header>

    <!-- 购物车内容 -->
    <main class="cart-page">
        <div class="cart-container">
            <h2>我的购物车</h2>
            
            <!-- 购物车商品列表 -->
            <div class="cart-items">
                <!-- 购物车为空时显示 -->
                <div class="cart-empty" style="display: none;">
                    <p>购物车还是空的，快去选购商品吧！</p>
                    <a href="index.html" class="continue-shopping">继续购物</a>
                </div>

                <!-- 购物车商品列表 -->
                <div class="cart-list">
                    <!-- 商品列表头部 -->
                    <div class="cart-header">
                        <span class="col-product">商品信息</span>
                        <span class="col-price">单价</span>
                        <span class="col-quantity">数量</span>
                        <span class="col-total">小计</span>
                        <span class="col-action">操作</span>
                    </div>

                    <!-- 商品项目示例 -->
                    <div class="cart-item">
                        <div class="col-product">
                            <img src="placeholder.jpg" alt="商品图片" class="cart-item-image">
                            <div class="cart-item-info">
                                <h3 class="cart-item-title">时尚休闲运动鞋</h3>
                            </div>
                        </div>
                        <div class="col-price">¥299.00</div>
                        <div class="col-quantity">
                            <div class="quantity-control">
                                <button class="quantity-btn minus">-</button>
                                <input type="number" value="1" min="1" class="quantity-input">
                                <button class="quantity-btn plus">+</button>
                            </div>
                        </div>
                        <div class="col-total">¥299.00</div>
                        <div class="col-action">
                            <button class="remove-btn">删除</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 购物车底部 -->
            <div class="cart-footer">
                <div class="cart-summary">
                    <div class="summary-item">
                        <span>商品总数：</span>
                        <span id="total-quantity">1</span>
                    </div>
                    <div class="summary-item">
                        <span>总计：</span>
                        <span id="total-price" class="total-price">¥299.00</span>
                    </div>
                </div>
                <div class="cart-actions">
                    <button class="clear-cart-btn">清空购物车</button>
                    <button class="checkout-btn">去结算</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>关于我们</h3>
                <p>公司简介</p>
                <p>我们的使命</p>
                <p>发展历程</p>
            </div>
            <div class="footer-section">
                <h3>客户服务</h3>
                <p>购物指南</p>
                <p>配送方式</p>
                <p>售后政策</p>
                <p>支付方式</p>
            </div>
            <div class="footer-section">
                <h3>联系我们</h3>
                <p>客服热线: 400-123-4567</p>
                <p>邮箱: service@shop.com</p>
                <p>地址: 北京市朝阳区科技园</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Goings商城. 保留所有权利。</p>
        </div>
    </footer>

    <!-- JavaScript 文件 -->
    <script src="assets/js/common/script.js"></script>
    <script src="assets/js/cart/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 用户登录状态在通用脚本中处理
            
            // 渲染购物车
            renderCart();
        });
    </script>
</body>
</html>
