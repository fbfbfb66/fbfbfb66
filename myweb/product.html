<!DOCTYPE html>
<html lang='zh-CN'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - Goings商城</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/product.css">
    <script src="assets/js/cart/cartManager.js"></script>
    <script src="assets/js/cart/cartCount.js"></script>
    <script src="assets/js/product/products.js"></script>
    <script src="assets/js/product.js"></script>
</head>
<body class="product-page">
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="logo">
            <h1><span class="logo-brand">Goings</span><span class="logo-text">商城</span></h1>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">首页</a>
            <a href="hot.html" class="nav-link">热销</a>
            <a href="new.html" class="nav-link">新品</a>
            <a href="sale.html" class="nav-link">优惠</a>
        </nav>
        <div class="cart">
            <a href="cart.html" class="cart-link">
                <span class="cart-icon">🛒</span>
                <span class="cart-count">0</span>
            </a>
        </div>
        <div class="user-welcome" id="user-welcome">
            <a href="login.html" class="login-link" id="login-link">登录</a>
            <div class="user-avatar-container" id="user-avatar-container" style="display: none;">
                <a href="user.html" class="user-avatar-link">
                    <img src="assets/images/avatar-placeholder.png" alt="用户头像" id="nav-user-avatar" class="user-avatar">
                    <span class="user-name" id="nav-username">用户</span>
                </a>
            </div>  
        </div>
    </header>

    <!-- 商品详情主体 -->
    <main class="product-container">
        <div class="product-detail">
            <!-- 图片容器 -->
            <div id="custom-image-container" style="width: 500px; height: 500px; margin-bottom: 20px; background-color: #f8f9fa; border-radius: 8px; overflow: hidden; flex-shrink: 0;">
                <!-- 图片将由 JavaScript 动态添加到这里 -->
            </div>
            
            <div class="product-info">
                <div class="product-header">
                    <h1 class="product-title" id="product-title">商品名称</h1>
                    <button class="favorite-btn" id="favorite-btn" title="收藏商品">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="favorite-icon">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                    </button>
                </div>
                <p class="product-price" id="product-price">¥0.00</p>        
                <p class="product-description" id="product-description">商品描述</p>

                <div class="product-features">
                    <h3>产品特点</h3>
                    <ul>
                        <li class="feature-item">加载中...</li>
                    </ul>
                </div>

                <!-- 数量控制 -->
                <div class="quantity-control">
                    <button id="decrease-quantity">-</button>
                    <input type="number" id="product-quantity" value="1" min="1">
                    <button id="increase-quantity">+</button>
                </div>

                <!-- 加入购物车按钮 -->
                <button class="add-to-cart-btn" id="add-to-cart">加入购物车</button>

                <a href="index.html" class="back-link">← 返回商城</a>      
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>关于我们</h3>
                <p>公司简介</p>
                <p>我们的使命</p>
                <p>发展历程</p>
            </div>
            <div class="footer-section">
                <h3>客户服务</h3>
                <p>购物指南</p>
                <p>配送方式</p>
                <p>售后政策</p>
                <p>支付方式</p>
            </div>
            <div class="footer-section">
                <h3>联系我们</h3>
                <p>客服热线: 400-123-4567</p>
                <p>邮箱: service@shop.com</p>
                <p>地址: 北京市朝阳区科技园</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Goings商城. 保留所有权利。</p>
        </div>
    </footer>
</body>
</html>
