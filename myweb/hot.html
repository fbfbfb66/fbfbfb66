<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热销商品 - Goings商城</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/cart/cartManager.js"></script>
    <script src="assets/js/cart/cartCount.js"></script>
    <script src="assets/js/common/category.js" defer></script>
</head>
<body class="hot-page">
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="logo">
            <h1><span class="logo-brand">Goings</span><span class="logo-text">商城</span></h1>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">首页</a>
            <a href="hot.html" class="nav-link active">热销</a>
            <a href="new.html" class="nav-link">新品</a>
            <a href="sale.html" class="nav-link">优惠</a>
        </nav>
        <div class="cart">
            <a href="cart.html" class="cart-link">
                <span class="cart-icon">🛒</span>
                <span class="cart-count">0</span>
            </a>
        </div>
        <div class="user-welcome" id="user-welcome">
            <a href="login.html" class="login-link" id="login-link">登录</a>
            <div class="user-avatar-container" id="user-avatar-container" style="display: none;">
                <a href="user.html" class="user-avatar-link">
                    <img src="assets/images/avatar-placeholder.png" alt="用户头像" id="nav-user-avatar" class="user-avatar">
                    <span class="user-name" id="nav-username">用户</span>
                </a>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <!-- 商品分类侧边栏 -->
        <aside class="categories">
            <h2>商品分类</h2>
            <ul class="category-list">
                <li><a href="#" class="category-link active" data-category="all">全部</a></li>
                <li><a href="#" class="category-link" data-category="electronics">电子产品</a></li>
                <li><a href="#" class="category-link" data-category="clothing">服装</a></li>
                <li><a href="#" class="category-link" data-category="food">食品</a></li>
                <li><a href="#" class="category-link" data-category="home">家居</a></li>
                <li><a href="#" class="category-link" data-category="beauty">美妆</a></li>
            </ul>
        </aside>

        <!-- 商品展示区 -->
        <section class="products">
            <h2 class="section-title">热销商品</h2>
            <div class="product-grid" id="product-grid">
                <!-- 商品卡片将通过JavaScript动态加载 -->
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>关于我们</h3>
                <p>公司简介</p>
                <p>我们的使命</p>
                <p>发展历程</p>
            </div>
            <div class="footer-section">
                <h3>客户服务</h3>
                <p>购物指南</p>
                <p>配送方式</p>
                <p>售后政策</p>
                <p>支付方式</p>
            </div>
            <div class="footer-section">
                <h3>联系我们</h3>
                <p>客服热线: 400-123-4567</p>
                <p>邮箱: service@shop.com</p>
                <p>地址: 北京市朝阳区科技园</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Goings商城. 保留所有权利。</p>
        </div>
    </footer>

    <script src="assets/js/common/script.js"></script>
    <script src="assets/js/product/products.js"></script>
    <script src="assets/js/cart/cartManager.js"></script>
    <script src="assets/js/cart/cartCount.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 用户登录状态在通用脚本中处理
            
            // 更新购物车数量
            CartManager.updateCartCount();
            
            // 动态加载商品卡片
            const productGrid = document.getElementById('product-grid');
            
            // 定义热销商品（为了展示效果，我们选择一些具有代表性的商品）
            // 智能手表、无线蓝牙耳机、高级护肤套装等新产品也会被展示为热销商品
            const hotProductIds = [3, 6, 10, 13, 14, 15, 16];
            const hotProducts = productsData.filter(product => hotProductIds.includes(product.id));
            
            // 初始显示所有热销商品
            renderProducts(hotProducts);
            
            // 添加分类筛选功能
            const categoryLinks = document.querySelectorAll('.category-link');
            categoryLinks.forEach(link => {
                link.addEventListener('click', function(event) {
                    event.preventDefault();
                    const category = this.dataset.category;
                    
                    // 移除所有分类链接的active类
                    categoryLinks.forEach(link => link.classList.remove('active'));
                    // 为当前点击的链接添加active类
                    this.classList.add('active');
                    
                    // 根据分类筛选热销商品
                    let filteredProducts = hotProducts;
                    if (category !== 'all') {
                        filteredProducts = hotProducts.filter(product => product.category === category);
                    }
                    
                    // 根据筛选结果渲染商品
                    renderProducts(filteredProducts);
                });
            });
            
            // 渲染商品卡片
            function renderProducts(products) {
                // 清空商品网格
                productGrid.innerHTML = '';
                
                if (products.length === 0) {
                    productGrid.innerHTML = '<div class="no-products">该分类下暂无热销商品</div>';
                    return;
                }
                
                // 为商品网格添加类，根据商品数量控制布局
                if (products.length === 1) {
                    productGrid.classList.add('single-product');
                } else {
                    productGrid.classList.remove('single-product');
                }
                
                // 为每个商品创建卡片
                products.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    productCard.dataset.category = product.category;
                    
                    productCard.innerHTML = `
                        <a href="product.html?id=${product.id}" class="product-link">
                            <div class="product-image">
                                <img src="${product.image}" alt="${product.name}" class="product-img">
                            </div>
                            <div class="product-info">
                                <h3 class="product-title">${product.name}</h3>
                                <p class="product-price">¥${product.price.toFixed(2)}</p>
                            </div>
                        </a>
                        <button class="add-to-cart-btn" data-id="${product.id}">加入购物车</button>
                    `;
                    
                    productGrid.appendChild(productCard);
                    
                    // 添加购物车按钮点击事件
                    const addToCartBtn = productCard.querySelector('.add-to-cart-btn');
                    addToCartBtn.addEventListener('click', function() {
                        CartManager.addItem({
                            id: product.id,
                            name: product.name,
                            price: product.price,
                            quantity: 1,
                            image: product.image
                        });
                        
                        // 更新购物车数量
                        CartManager.updateCartCount();
                        
                        // 显示添加成功提示
                        alert(`已成功将 ${product.name} 加入购物车！`);
                    });
                });
            }
        });
    </script>
</body>
</html>
