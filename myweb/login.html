<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Goings商城</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page-body">
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="logo">
            <h1><span class="logo-brand">Goings</span><span class="logo-text">商城</span></h1>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">首页</a>
            <a href="hot.html" class="nav-link">热销</a>
            <a href="new.html" class="nav-link">新品</a>
            <a href="sale.html" class="nav-link">优惠</a>
        </nav>
        <div class="cart">
            <a href="cart.html" class="cart-link">
                <span class="cart-icon">🛒</span>
                <span class="cart-count">0</span>
            </a>
        </div>
        <div class="user-welcome" id="user-welcome">
            <a href="login.html" class="login-link active" id="login-link">登录</a>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="login-container">
            <div class="store-welcome">Welcome Goings Store</div>
            <div class="login-form">
                <h2>用户登录</h2>
                <div class="form-groups-container">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="请输入您的用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" placeholder="请输入您的密码" required>
                    </div>
                </div>
                <button type="button" id="login-btn" class="login-btn">登录</button>
                <p class="login-message" id="login-message"></p>
                <p class="register-guide">还没有账号？<a href="register.html" class="register-link">去注册</a></p>
            </div>
            <div class="forgot-password-container" style="text-align: center; margin-top: 1rem;">
                <p class="forgot-password-guide"><a href="forgot.html" class="forgot-password-link">忘记密码？</a></p>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>关于我们</h3>
                <p>公司简介</p>
                <p>我们的使命</p>
                <p>发展历程</p>
            </div>
            <div class="footer-section">
                <h3>客户服务</h3>
                <p>购物指南</p>
                <p>配送方式</p>
                <p>售后政策</p>
                <p>支付方式</p>
            </div>
            <div class="footer-section">
                <h3>联系我们</h3>
                <p>客服热线: 400-123-4567</p>
                <p>邮箱: service@shop.com</p>
                <p>地址: 北京市朝阳区科技园</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Goings商城. 保留所有权利。</p>
        </div>
    </footer>

    <script>
        /**
         * 登录功能模块
         */
        const LoginManager = {
            // DOM元素
            elements: {
                loginForm: null,
                usernameInput: null,
                passwordInput: null,
                loginBtn: null,
                loginMessage: null
            },
            
            // 初始化
            init: function() {
                // 获取DOM元素
                this.elements.usernameInput = document.getElementById('username');
                this.elements.passwordInput = document.getElementById('password');
                this.elements.loginBtn = document.getElementById('login-btn');
                this.elements.loginMessage = document.getElementById('login-message');
                
                // 检查URL参数
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('registered') === 'true') {
                    this.showSuccess('注册成功，请登录');
                }
                
                // 绑定事件
                this.bindEvents();
                
                // 聚焦用户名输入框
                this.elements.usernameInput.focus();
            },
            
            // 绑定事件
            bindEvents: function() {
                // 登录按钮点击事件
                this.elements.loginBtn.addEventListener('click', this.handleLogin.bind(this));
                
                // 键盘回车事件
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        this.handleLogin();
                    }
                });
                
                // 清除错误信息
                this.elements.usernameInput.addEventListener('input', this.clearErrorMessage.bind(this));
                this.elements.passwordInput.addEventListener('input', this.clearErrorMessage.bind(this));
            },
            
            // 清除错误信息
            clearErrorMessage: function() {
                this.elements.loginMessage.textContent = '';
                this.elements.usernameInput.classList.remove('input-error');
                this.elements.passwordInput.classList.remove('input-error');
            },
            
            // 验证表单
            validateForm: function() {
                const username = this.elements.usernameInput.value.trim();
                const password = this.elements.passwordInput.value;
                
                if (!username) {
                    this.showError('请输入用户名');
                    this.elements.usernameInput.classList.add('input-error');
                    this.elements.usernameInput.focus();
                    return false;
                }
                
                if (!password) {
                    this.showError('请输入密码');
                    this.elements.passwordInput.classList.add('input-error');
                    this.elements.passwordInput.focus();
                    return false;
                }
                
                return true;
            },
            
            // 显示错误信息
            showError: function(message) {
                this.elements.loginMessage.textContent = message;
                this.elements.loginMessage.style.color = '#e74c3c';
            },
            
            // 显示成功信息
            showSuccess: function(message) {
                this.elements.loginMessage.textContent = message;
                this.elements.loginMessage.style.color = '#2ecc71';
            },
            
            // 处理登录
            handleLogin: function() {
                // 验证表单
                if (!this.validateForm()) {
                    return;
                }
                
                const username = this.elements.usernameInput.value.trim();
                const password = this.elements.passwordInput.value;
                
                // 设置按钮为加载状态
                const originalBtnText = this.elements.loginBtn.textContent;
                this.elements.loginBtn.textContent = '登录中...';
                this.elements.loginBtn.classList.add('btn-loading');
                this.elements.loginBtn.disabled = true;
                
                // 模拟登录请求
                this.mockLoginRequest(username, password)
                    .then(response => {
                        // 保存用户信息
                        localStorage.setItem('username', username);
                        
                        // 显示成功信息
                        this.showSuccess(`登录成功，欢迎你 ${username}`);
                        
                        // 2秒后跳转到首页
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    })
                    .catch(error => {
                        this.showError(error.message);
                        
                        // 根据错误类型添加相应的错误样式
                        if (error.type === 'username') {
                            this.elements.usernameInput.classList.add('input-error');
                        } else if (error.type === 'password') {
                            this.elements.passwordInput.classList.add('input-error');
                        }
                    })
                    .finally(() => {
                        // 恢复按钮状态
                        setTimeout(() => {
                            this.elements.loginBtn.textContent = originalBtnText;
                            this.elements.loginBtn.classList.remove('btn-loading');
                            this.elements.loginBtn.disabled = false;
                        }, 1000);
                    });
            },
            
            // 模拟登录请求
            mockLoginRequest: function(username, password) {
                return new Promise((resolve, reject) => {
                    // 模拟网络延迟
                    setTimeout(() => {
                        // 在实际应用中，这里应该调用后端API进行验证
                        
                        // 以下为模拟验证逻辑
                        const isUserExists = localStorage.getItem(username) !== null || username === 'admin';
                        
                        if (!isUserExists) {
                            reject({
                                message: '用户不存在，请先注册',
                                type: 'username'
                            });
                            return;
                        }
                        
                        const isPasswordCorrect = password === 'password123' || password === '123456';
                        
                        if (!isPasswordCorrect) {
                            reject({
                                message: '密码错误，请重新输入',
                                type: 'password'
                            });
                            return;
                        }
                        
                        // 模拟登录成功
                        resolve({ success: true, message: '登录成功' });
                    }, 1000);
                });
            }
        };
        
        // 页面加载完成后初始化登录模块
        document.addEventListener('DOMContentLoaded', function() {
            LoginManager.init();
        });
    </script>
</body>
</html>
